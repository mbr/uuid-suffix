[package]
name = "dandruff"
description = "Time-ordered UUID (v6/v7) newtype with short ID display and efficient serialization"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mbr/dandruff-rs"

[dependencies]
arbitrary = { version = "1", optional = true }
arrow-schema = { version = "55", optional = true }
borsh = { version = "1", optional = true }
bytemuck = { version = "1", optional = true }
serde = { version = "1", optional = true }
sqlx = { version = "0.8", optional = true, default-features = false }
thiserror = "2"
uuid = { version = "1" }

[dev-dependencies]
bincode = "1"
proptest = "1"
serde_json = "1"

[features]
default = ["v6", "v7"]
v6 = ["uuid/v6", "uuid/rng"]
v7 = ["uuid/v7", "uuid/rng"]
fast-rng = ["uuid/fast-rng"]
rng-rand = ["uuid/rng-rand"]
rng-getrandom = ["uuid/rng-getrandom"]
js = ["uuid/js"]
serde = ["dep:serde", "uuid/serde"]
borsh = ["dep:borsh", "uuid/borsh"]
bytemuck = ["dep:bytemuck", "uuid/bytemuck"]
arbitrary = ["dep:arbitrary", "uuid/arbitrary"]
sqlx-postgres = ["dep:sqlx", "sqlx/postgres", "sqlx/uuid"]
sqlx-sqlite = ["dep:sqlx", "sqlx/sqlite", "sqlx/uuid"]
datafusion = ["dep:arrow-schema"]
