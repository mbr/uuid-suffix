[package]
name = "dandruff"
description = "UUIDv7 newtype with short ID display and efficient serialization"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/mbr/dandruff-rs"

[dependencies]
thiserror = "2"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
proptest = "1"

[features]
default = []
fast-rng = ["uuid/fast-rng"]
rng-rand = ["uuid/rng-rand"]
rng-getrandom = ["uuid/rng-getrandom"]
js = ["uuid/js"]
